<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<!-- PWA：可加到手机主屏幕，离线也能用（全部用相对路径，GitHub Pages 子路径也正常） -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#fbf4e6" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />

<!-- iOS：全屏运行 + 主屏幕名称 + 状态栏与护眼底色一致 -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="识字卡片" />
<meta name="application-name" content="识字卡片" />
<meta name="description" content="儿童识字猜字游戏：32 个汉字，图形化解释、语音朗读、护眼底色，可离线使用。" />
<!--
  文件结构（按「一类东西放一个文件」拆的，方便维护）
    index.html        页面骨架 + meta/PWA 配置
    styles.css        全部样式（含白天/夜间两套主题变量）
    data/cards.js     32 个汉字的内容与插画（日常维护基本只改这个）
    app.js            游戏逻辑（翻牌、发音、抽屉、主题、音效…）
    sw.js             Service Worker，离线缓存
  注：刻意用普通 <script> 而不是 ES module，这样双击本文件（file://）也能直接玩。
-->
<title>识字卡片 · 猜猜这是什么字</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="top">
  <button class="menu-btn" id="menuBtn" aria-label="打开字表" aria-expanded="false">
    ☰<span class="menu-label" id="menuLabel">字表 1/32</span>
  </button>
  <div class="title">识字卡片 <small>先猜一猜，再翻过来看看</small></div>
  <div class="top-right">
    <button class="theme-btn" id="sfxBtn" title="音效" aria-label="音效开关">🔔</button>
      <button class="theme-btn" id="themeBtn" title="护眼：切换白天 / 夜间" aria-label="切换白天夜间模式">🌙</button>
  </div>
</div>

<!-- 抽屉：全部汉字一览，点字直接定位 -->
<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="全部汉字">
  <div class="dhead">
    <b>字表</b><span id="dcount"></span>
    <button class="dclose" id="drawerClose" aria-label="收起字表">✕</button>
  </div>
  <div class="dbody" id="dbody"></div>
</aside>

<div class="stage">
  <div class="card-swipe" id="swipe">
  <div class="card" id="card">
    <div class="face front" id="front">
      <div class="hero"><div class="big" id="big" title="点一下听读音"></div></div>
      <div class="foot">
        <div class="words" id="words"></div>
      </div>
    </div>
    <div class="face back" id="back">
      <div class="backchar" id="backchar"></div>
      <div class="backtag">看图画猜字</div>
      <div id="picbox"></div>
      <div class="explain" id="explain"></div>
      <div class="backhint">🔊 点「读一遍」听字、组词和讲解</div>
    </div>
  </div>
  </div>
  <div class="touchhint"><b>点卡片</b>翻面<span class="dot">·</span><b>左右滑动</b>换一张<span class="dot">·</span>点<b>读一遍</b>听发音</div>
</div>

<div class="bar">
  <button class="btn blue round" id="prev" aria-label="上一个">◀</button>
  <button class="btn orange" id="speak">🔊<span class="btn-txt"> 读一遍</span></button>
  <button class="btn green" id="flip">🔄<span class="btn-txt"> 翻面看图画</span></button>
  <button class="btn blue round" id="next" aria-label="下一个">▶</button>
  <button class="btn purple" id="shuffle">🎲<span class="btn-txt"> 打乱</span></button>
</div>
<div class="hint"><span class="kbd">空格</span> 翻面　·　<span class="kbd">←</span> <span class="kbd">→</span> 上一个 / 下一个　·　<span class="kbd">I</span> 字表　·　<span class="kbd">R</span> 再听一遍　·　<span class="kbd">S</span> 打乱</div>
<div class="toast" id="toast"></div>

<script src="data/cards.js"></script>
<script src="app.js"></script>
</body>
</html>
