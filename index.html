<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fdf7ec" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="识字卡片" />
<link rel="apple-touch-icon" href="icon.png" />
<link rel="manifest" href="manifest.json" />
<title>识字卡片 · 猜猜这是什么字</title>
<style>
  :root{
    --cream:#fffdf7; --ink:#2b2b2b; --line:#e6dfd1;
    --orange:#ff9a3c; --blue:#4fb3e8; --green:#57c98b; --pink:#ff7a9a; --purple:#9b7bf0;
    --paper:#fff8ea;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html{ -webkit-text-size-adjust:100% }
  html,body{height:100%}
  body{
    margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
    background:
      radial-gradient(1200px 700px at 12% -8%, #ffe9b8 0%, rgba(255,233,184,0) 60%),
      radial-gradient(900px 600px at 105% 8%, #cdeaff 0%, rgba(205,234,255,0) 55%),
      radial-gradient(900px 700px at 50% 115%, #d8ffe6 0%, rgba(216,255,230,0) 55%),
      #fdf7ec;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink); overflow-x:hidden;
    touch-action:manipulation;
  }
  .top{
    width:100%; max-width:760px; padding:18px 20px 6px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .title{font-size:19px; font-weight:800; letter-spacing:1px}
  .title small{font-weight:600; color:#a99a86; font-size:13px; letter-spacing:0; margin-left:8px}
  .counter{font-size:15px; font-weight:800; color:#b08a4f; background:#fff3d8;
           border:2px solid #ffe0a8; border-radius:999px; padding:6px 14px; white-space:nowrap}
  .stage{flex:1 1 auto; min-height:0; width:100%; max-width:760px; padding:6px 20px 0;
         display:flex; align-items:center; justify-content:center; perspective:1400px}
  .card{
    position:relative; width:100%; max-width:640px; aspect-ratio:1/1.06;
    max-height:100%; transform-style:preserve-3d; transition:transform .62s cubic-bezier(.22,.9,.28,1);
    cursor:pointer; touch-action:manipulation;
  }
  .card.flipped{transform:rotateY(180deg)}
  .face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:34px; background:var(--paper);
    box-shadow:0 18px 0 rgba(0,0,0,.06), 0 0 0 6px #fff, 0 0 0 10px #efe6d4, 0 22px 44px rgba(120,95,60,.18);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:26px 24px; overflow:hidden;
  }
  .back{transform:rotateY(180deg)}

  /* ---------- 正面 ---------- */
  .pinyin{font-family:"Times New Roman",Georgia,serif; font-size:34px; letter-spacing:2px; color:#c9922f; font-weight:700}
  .big{
    font-size:clamp(120px, 30vw, 230px); line-height:.98; font-weight:800; margin:2px 0 4px;
    font-family:"Kaiti SC","STKaiti","KaiTi","PingFang SC",serif;
    color:#222; text-shadow:0 4px 0 #f1e7d3; cursor:pointer; transition:transform .15s;
  }
  .big:active{transform:scale(.95)}
  .words{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:6px}
  .word{
    font-size:clamp(18px,4.4vw,26px); font-weight:700; padding:8px 16px; border-radius:999px;
    background:#fff; border:3px solid #ffe1b0; color:#6b5a3e; letter-spacing:1px;
  }
  .word i{font-style:normal; color:#c9b28c; font-size:.72em; font-family:"Times New Roman",serif; margin-left:6px}
  .cta{
    margin-top:16px; font-size:15px; color:#b3a48f; font-weight:700;
    display:flex; align-items:center; gap:8px;
  }
  .cta .blink{animation:blink 1.5s infinite}
  @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}

  /* ---------- 背面 ---------- */
  .pic{width:min(62%, 330px); height:auto; display:block}
  .explain{
    margin-top:10px; font-size:clamp(17px,4.2vw,23px); font-weight:800; color:#4a4034;
    text-align:center; line-height:1.5; letter-spacing:.5px;
  }
  .explain b{color:var(--orange)}
  .backchar{
    position:absolute; top:18px; left:24px; font-size:52px; font-weight:800; color:#efe4cf;
    font-family:"Kaiti SC","STKaiti",serif; line-height:1;
  }
  .backtag{
    position:absolute; top:22px; right:24px; font-size:13px; font-weight:800; color:#fff;
    background:var(--green); border-radius:999px; padding:5px 12px; letter-spacing:1px;
  }

  /* ---------- 按钮 ---------- */
  .bar{
    width:100%; max-width:760px; padding:16px 20px calc(22px + env(safe-area-inset-bottom));
    display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap;
  }
  .btn{
    border:none; border-radius:22px; font-family:inherit; font-weight:800; cursor:pointer;
    font-size:17px; padding:15px 22px; color:#fff; background:#c9bda8;
    box-shadow:0 5px 0 rgba(0,0,0,.14); transition:transform .08s, filter .15s;
    display:inline-flex; align-items:center; gap:8px; touch-action:manipulation;
  }
  .btn:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.14)}
  .btn.orange{background:var(--orange)} .btn.blue{background:var(--blue)}
  .btn.green{background:var(--green)}  .btn.pink{background:var(--pink)}
  .btn.purple{background:var(--purple)}
  .btn.round{padding:15px 18px; font-size:21px}
  .btn[disabled]{filter:grayscale(.6) opacity(.55); cursor:default}
  .hint{width:100%; text-align:center; font-size:12.5px; color:#b6a894; margin-top:2px; letter-spacing:.4px}

  /* ---------- 小彩蛋动画 ---------- */
  .pop{animation:pop .45s ease}
  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.16)}100%{transform:scale(1)}}
  .sparkle{position:fixed; pointer-events:none; font-size:26px; animation:fly .9s ease-out forwards; z-index:50}
  @keyframes fly{0%{opacity:1; transform:translate(-50%,-50%) scale(.6)}
                 100%{opacity:0; transform:translate(-50%,-140px) scale(1.35)}}
  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background:rgba(43,43,43,.92); color:#fff; font-size:14px; font-weight:600;
    padding:11px 18px; border-radius:14px; opacity:0; transition:opacity .3s; z-index:60; pointer-events:none;
    max-width:86vw; text-align:center;
  }
  .toast.show{opacity:1}
  @media (max-width:420px){
    .top{padding:12px 14px 4px}
    .title{font-size:16px}
    .title small{display:none}
    .stage{padding:4px 14px 0}
    .face{border-radius:24px; padding:16px 12px}
    .words{gap:8px}
    .word{padding:6px 12px}
    .cta{font-size:13px; margin-top:12px}
    .bar{padding:10px 12px calc(14px + env(safe-area-inset-bottom)); gap:8px}
    .btn{font-size:15px; padding:12px 14px; border-radius:16px; box-shadow:0 4px 0 rgba(0,0,0,.14)}
    .btn.round{padding:12px 14px; font-size:18px}
    .btn-say{display:none}
    .btn-txt{display:none}
    .cta-text{display:none}
    .backchar{font-size:40px; top:12px; left:16px}
    .backtag{top:14px; right:16px; font-size:11.5px; padding:4px 10px}
    .hint{font-size:11px; padding:0 12px}
  }
  @media (max-height:700px){
    .cta{display:none}
    .card{max-width:min(640px, 62vh)}
  }
  @media (prefers-reduced-motion:reduce){
    .card{transition:none} .blink{animation:none} .pop{animation:none}
  }
</style>
</head>
<body>

<div class="top">
  <div class="title">识字卡片 <small>先猜一猜，再翻过来看看</small></div>
  <div class="counter" id="counter" aria-live="polite">1 / 17</div>
</div>

<div class="stage">
  <div class="card" id="card">
    <div class="face front" id="front">
      <div class="pinyin" id="pinyin"></div>
      <div class="big" id="big" title="点一下听读音"></div>
      <div class="words" id="words"></div>
      <div class="cta"><span class="blink">👆</span><span class="cta-text">点卡片翻到背面，看看它像什么</span></div>
    </div>
    <div class="face back" id="back">
      <div class="backchar" id="backchar"></div>
      <div class="backtag">看图画猜字</div>
      <div id="picbox"></div>
      <div class="explain" id="explain"></div>
    </div>
  </div>
</div>

<div class="bar">
  <button class="btn blue round" id="prev" aria-label="上一个">◀</button>
  <button class="btn orange btn-say" id="speak">🔊 听一听</button>
  <button class="btn green" id="flip">🔄<span class="btn-txt"> 翻面看图画</span></button>
  <button class="btn pink" id="speakWords">📣<span class="btn-txt"> 听组词</span></button>
  <button class="btn blue round" id="next" aria-label="下一个">▶</button>
  <button class="btn purple" id="shuffle">🎲<span class="btn-txt"> 打乱</span></button>
</div>
<div class="hint">空格 = 翻面　·　← → = 上一个 / 下一个　·　R = 再听一遍　·　S = 打乱顺序</div>
<div class="toast" id="toast"></div>

<script>
/* =======================================================================
   识字卡片：数据区

   画布统一为 200 × 200

const P = {

  red:'#f2704f', redD:'#d9502f', orange:'#ffb03c', orangeD:'#e08c1c',
  blue:'#5bb8e8', blueD:'#3d9fd4', yellow:'#ffd455', grey:'#b9b1a4',

  purple:'#9b7bf0'
};
const SVG_HEAD = '<svg class="pic" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">';
const SVG_TAIL = '</svg>';

        <line x1="10" y1="100" x2="26" y2="100"/>

        <line x1="33" y1="33" x2="45" y2="45"/>
        <line x1="155" y1="155" x2="167" y2="167"/>
        <line x1="167" y1="33" x2="155" y2="45"/>
        <line x1="45" y1="155" x2="33" y2="167"/>
      </g>
      <circle cx="100" cy="100" r="46" fill="${P.yellow}" stroke="${P.orange}" stroke-width="7"/>
      <circle cx="84" cy="92" r="5" fill="#7a5a20"/>

  /* ---------------- 山 ---------------- */
  { char:'山', py:'shān', tone:1, words:[['大山','dà shān'],['山峰','shān fēng'],['爬山','pá shān']],

  /* ---------------- 口 ---------------- */

        <line x1="178" y1="56" x2="192" y2="40"/><line x1="166" y1="40" x2="174" y2="20"/>
      </g>` },

  /* ---------------- 手 ---------------- */

/* =======================================================================
   游戏逻辑
   ======================================================================= */
const $ = id => document.getElementById(id);
const card     = $('card');
const elBig    = $('big');
const elPinyin = $('pinyin');
const elWords  = $('words');
const elPic    = $('picbox');
const elExplain= $('explain');
const elBackChar = $('backchar');
const elCounter= $('counter');
const toast    = $('toast');
const flipBtn  = $('flip');

let order = DATA.map((_, i) => i);
let pos = 0;
let flipped = false;
const cur = () => DATA[order[pos]];

/* ---------------- 语音 ---------------- */
let zhVoice = null;
const speechOK = ('speechSynthesis' in window) && (typeof SpeechSynthesisUtterance === 'function');
let speakToken = 0;

function pickVoice() {
  if (!speechOK) return;
  const vs = speechSynthesis.getVoices() || [];
  if (!vs.length) return;
  const zh = vs.filter(v => /zh|cmn|Chinese|中文|普通话/i.test(v.lang + ' ' + v.name));
  zhVoice =
    zh.find(v => /Tingting|婷婷|Meijia|美佳|Xiaoxiao|晓晓|PingFang|Google 普通话|Chinese \(China\)|zh-CN/i.test(v.name + ' ' + v.lang)) ||
    zh[0] || null;
}
if (speechOK) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

function say(text, opts = {}) {
  if (!speechOK) { showToast('这个浏览器不支持朗读，换 Chrome / Safari / 微信试试'); return; }
  const token = ++speakToken;
  try { speechSynthesis.cancel(); } catch (_) {}
  setTimeout(() => {
    if (token !== speakToken) return;
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-CN';
      if (zhVoice) u.voice = zhVoice;
      u.rate   = opts.rate   ?? 0.82;
      u.pitch  = opts.pitch  ?? 1.1;
      u.volume = 1;
      u.onerror = () => {};
      speechSynthesis.speak(u);
    } catch (e) {
      showToast('朗读失败：' + e.message);
    }
  }, 60);
}
const sayChar  = () => say(cur().char, { rate: 0.72, pitch: 1.15 });
const sayWords = () => say(cur().words.map(w => w[0]).join('，'), { rate: 0.85 });

/* ---------------- 提示条 ---------------- */
let toastTimer = null;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

/* ---------------- 渲染 ---------------- */
function render(animate) {
  const d = cur();
  elPinyin.textContent = d.py;
  elBig.textContent    = d.char;
  elWords.innerHTML    = d.words.map(([w, p]) => `<span class="word">${w}<i>${p}</i></span>`).join('');
  elPic.innerHTML      = SVG_HEAD + d.pic + SVG_TAIL;
  elExplain.innerHTML  = d.tip;
  elBackChar.textContent = d.char;
  elCounter.textContent  = `${pos + 1} / ${order.length}`;
  if (animate) {
    elBig.classList.remove('pop');
    void elBig.offsetWidth;
    elBig.classList.add('pop');
  }
}

function setFlip(v) {
  flipped = !!v;
  card.classList.toggle('flipped', flipped);
  flipBtn.innerHTML = flipped
    ? '🔄<span class="btn-txt"> 翻回正面</span>'
    : '🔄<span class="btn-txt"> 翻面看图画</span>';
  if (flipped) sayChar();
}

function toggleFlip() {
  setFlip(!flipped);
  if (flipped) sparkle();
}

function sparkle() {
  const box = card.getBoundingClientRect();
  const chars = ['⭐', '✨', '🌟', '💫', '🎉'];
  for (let i = 0; i < 5; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.textContent = chars[(Math.random() * chars.length) | 0];
    s.style.left = (box.left + box.width  * (0.25 + Math.random() * 0.5)) + 'px';
    s.style.top  = (box.top  + box.height * (0.35 + Math.random() * 0.3)) + 'px';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 950);
  }
}

function go(step) {
  pos = (pos + step + order.length) % order.length;
  setFlip(false);
  render(true);
  sayChar();
}

/* ---------------- 事件 ---------------- */
card.addEventListener('click', toggleFlip);

elBig.addEventListener('click', e => {
  e.stopPropagation();
  sayChar();
  elBig.classList.remove('pop');
  void elBig.offsetWidth;
  elBig.classList.add('pop');
});

flipBtn.addEventListener('click', toggleFlip);
$('speak').addEventListener('click', sayChar);
$('speakWords').addEventListener('click', sayWords);
$('prev').addEventListener('click', () => go(-1));
$('next').addEventListener('click', () => go(1));

$('shuffle').addEventListener('click', () => {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  pos = 0;
  setFlip(false);
  render(true);
  showToast('顺序已打乱 🎲');
});

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'button' || tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;

  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggleFlip(); }
  else if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft')  go(-1);
  else if (e.key.toLowerCase() === 'r') sayChar();
  else if (e.key.toLowerCase() === 's') $('shuffle').click();
});

/* ---------------- 启动 ---------------- */
render(false);
setFlip(false);

document.addEventListener('pointerdown', function once() {
  document.removeEventListener('pointerdown', once);
  if (speechOK) pickVoice();
}, { once: true });

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && speechOK) { try { speechSynthesis.resume(); } catch (_) {} }
});
</script>
